<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#10b981"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-dasharray="2 2" stroke-width=".7" d="M 40 0 L 0 0 0 40" opacity=".4"/></pattern><style>@keyframes floatPulse{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-10px) scale(1.05);opacity:.6}}@keyframes dashFlow{0%{stroke-dashoffset:100}}@keyframes waveMotion{0%{transform:translateX(0)}50%{transform:translateX(-30px)}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#f8fafc}.animated-bg-circle{animation:floatPulse 6s ease-in-out infinite}.animated-line{stroke-dasharray:12,12;animation:dashFlow 20s linear infinite}.wave-path{animation:waveMotion 8s ease-in-out infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><g opacity=".25"><circle cx="150" cy="80" r="120" fill="#f59e0b" class="animated-bg-circle" filter="ur