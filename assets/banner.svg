<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-dasharray="2,2" opacity="0.4"/>
    </pattern>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
      
      /* CSS Keyframe Animations */
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.3; }
        50% { transform: translateY(-10px) scale(1.05); opacity: 0.6; }
        100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      }
      
      @keyframes dashFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes waveMotion {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }

      .animated-bg-circle { animation: floatPulse 6s ease-in-out infinite; }
      .animated-line { stroke-dasharray: 12, 12; animation: dashFlow 20s linear infinite; }
      .wave-path { animation: waveMotion 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Dynamic / Animated Background Graphical Elements (Positioned safely behind text & foreground cards) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#f59e0b" filter="url(#glow)" class="animated-bg-circle" />
    <circle cx="1050" cy="240" r="150" fill="#3b82f6" filter="url(#glow)" class="animated-bg-circle" style="animation-delay: -3s;" />
  </g>

  <!-- Construction Blueprint Lines (Dynamic animation in background) -->
  <path d="M -50 260 Q 300 180 650 270 T 1250 200" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4" class="animated-line wave-path" />
  <path d="M -50 280 Q 400 320 800 230 T 1250 250" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3" class="animated-line wave-path" style="animation-delay: -2s;" />

  <!-- Bottom Accent Bar -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#accentGrad)" rx="4"/>

  <!-- Decorative Foreground Cards (Right Side) -->
  <g transform="translate(820, 45)">
    <!-- Card 1: Jobsite Analytics -->
    <rect x="0" y="0" width="320" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" shadow="true" />
    <circle cx="35" cy="47" r="18" fill="#f59e0b" opacity="0.2" />
    <path d="M 27 47 L 33 53 L 43 41" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <text x="70" y="42" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Daily Field Reports</text>
    <text x="70" y="65" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">Real-time site logs &amp; safety compliance</text>

    <!-- Card 2: BIM & Drawings -->
    <rect x="0" y="115" width="320" height="95" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="162" r="18" fill="#3b82f6" opacity="0.2" />
    <path d="M 28 155 L 42 155 M 28 162 L 42 162 M 28 169 L 36 169" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
    <text x="70" y="157" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#f8fafc">Plan Viewing &amp; BIM</text>
    <text x="70" y="180" font-family="'Segoe UI', sans-serif" font-weight="500" font-size="13" fill="#94a3b8">Mobile drawings, markups &amp; punch lists</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Crisp & High Contrast) -->
  <g transform="translate(60, 80)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="14" y="21" class="badge-text" fill="#fbbf24">🏗️ CONSTRUCTION TECH ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">Awesome Field Service</text>
    <text x="0" y="130" class="title" fill="url(#textGrad)">Construction 🚜</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated SaaS Platforms, Mobile Jobsite Tools &amp; Open-Source ERPs</text>
    <text x="0" y="200" class="subtitle" font-size="15" fill="#64748b">Empowering General Contractors, Specialty Trades &amp; Field Supervisors</text>
  </g>
</svg>
